name: Package and release

# Releases are intentionally tag-only. Creating or updating the prototype branch
# cannot publish an addon. Maintainer approval is required before tagging.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Package and publish to CurseForge
        # Same pinned packager used by PetXPBarPlus; supports 16xxx Forever clients.
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
